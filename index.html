<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>CID-11 Embedded Browser</title>
    <!-- Folha de estilos oficial da versão 1.5.1 da OMS[cite: 2] -->
    <link rel="stylesheet" href="https://icdcdn.who.int/embeddedct/icd11ect-1.8.css">
</head>
<body style="margin: 0; padding: 10px; font-family: sans-serif;">

    <!-- Janela obrigatória do Embedded Browser -->
    <div class="ctw-eb-window" data-ctw-ino="1" style="min-height: 600px;"></div>

    <!-- Script oficial da versão 1.5.1 da OMS[cite: 2] -->
    <script src="https://icdcdn.who.int/embeddedct/icd11ect-1.8.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const mySettings = {
                apiServerUrl: "https://icd11restapi-developer-test.azurewebsites.net",
                language: "pt", // Força o idioma português
                source: "mms",
                enableSelectButton: "all"
            };

            const myCallbacks = {
                selectedEntityFunction: function (selectedEntity) {
                    enviarParaProntuario(selectedEntity.code, selectedEntity.title);
                }
            };

            if (typeof ECT !== 'undefined') {
                ECT.Handler.configure(mySettings, myCallbacks);
            }

            function enviarParaProntuario(code, title) {
                if (!code) return;
                console.log("A enviar para o prontuário -> Código:", code, "Título:", title);
                window.parent.postMessage({
                    type: "CID_SELECIONADO",
                    code: code,
                    title: title
                }, "*");
            }

            // Captura de segurança por cliques na interface caso o callback nativo falhe
            document.addEventListener("click", function (event) {
                const target = event.target;
                // Procura por botões ou elementos de seleção gerados pela OMS
                if (target && (target.classList.contains("ctw-select") || target.innerText === "Selecionar" || target.getAttribute("data-ctw-action") === "select")) {
                    console.log("Clique detetado no botão de seleção da OMS");
                    
                    // Tenta extrair os dados da entidade ativa na página da OMS
                    setTimeout(() => {
                        const codeElement = document.querySelector(".ctw-code, .code, [class*='code']");
                        const titleElement = document.querySelector(".ctw-title, .title, [class*='title']");
                        
                        if (codeElement) {
                            const code = codeElement.innerText.trim();
                            const title = titleElement ? titleElement.innerText.trim() : "";
                            enviarParaProntuario(code, title);
                        }
                    }, 300);
                }
            }, true);
        });
    </script>
</body>
</html>
